<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FootAI Live & Pronos</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #00e676;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #2a2a2a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 15px;
      color: var(--accent);
    }

    .sports-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .sport-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .sport-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .date-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 8px;
    }

    .date-btn.active {
      background: var(--border);
      color: var(--text);
      font-weight: bold;
    }

    input[type="date"] {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px;
      border-radius: 8px;
    }

    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid var(--border);
    }

    .league-title {
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      font-weight: bold;
    }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .team-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .score {
      font-weight: bold;
      color: var(--accent);
      font-size: 1rem;
    }

    .status {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #333;
      color: #fff;
    }

    .status.live {
      background: #e53935;
      font-weight: bold;
    }

    #loading {
      text-align: center;
      color: var(--text-muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>⚡ FootAI Live & Pronos</h1>

  <div class="sports-bar">
    <button class="sport-btn active" onclick="switchSport('football', this)">⚽ Football</button>
    <button class="sport-btn" onclick="switchSport('basketball', this)">🏀 Basket</button>
    <button class="sport-btn" onclick="switchSport('hockey', this)">🏒 Hockey</button>
  </div>

  <div class="date-bar">
    <button class="date-btn" onclick="setDateFilter('yesterday', this)">Hier</button>
    <button class="date-btn active" onclick="setDateFilter('live', this)">🔴 Direct</button>
    <button class="date-btn" onclick="setDateFilter('today', this)">Aujourd'hui</button>
    <button class="date-btn" onclick="setDateFilter('tomorrow', this)">Demain</button>
    <input type="date" id="customDate" onchange="onCustomDateChange(this.value)" />
  </div>

  <div id="loading">Chargement des matchs...</div>
  <div class="matches-list" id="matchesContainer"></div>

  <script>
    const API_KEY = "08af7ecbff2c8d4742792bc29b858165";
    let currentSport = 'football';
    let currentFilter = 'live';

    const SPORT_CONFIGS = {
      football: {
        baseUrl: "https://v3.football.api-sports.io/fixtures",
        getName: item => ({
          home: item.teams.home.name,
          homeLogo: item.teams.home.logo,
          away: item.teams.away.name,
          awayLogo: item.teams.away.logo,
          league: `${item.league.country || ''} - ${item.league.name}`,
          scoreHome: item.goals.home ?? 0,
          scoreAway: item.goals.away ?? 0,
          status: item.fixture.status.short,
          elapsed: item.fixture.status.elapsed
        })
      },
      basketball: {
        baseUrl: "https://v1.basketball.api-sports.io/games",
        getName: item => ({
          home: item.teams.home.name,
          homeLogo: item.teams.home.logo,
          away: item.teams.away.name,
          awayLogo: item.teams.away.logo,
          league: `${item.country ? item.country.name : ''} - ${item.league.name}`,
          scoreHome: item.scores.home ? item.scores.home.total ?? 0 : 0,
          scoreAway: item.scores.away ? item.scores.away.total ?? 0 : 0,
          status: item.status.short,
          elapsed: item.status.timer
        })
      },
      hockey: {
        baseUrl: "https://v1.hockey.api-sports.io/games",
        getName: item => ({
          home: item.teams.home.name,
          homeLogo: item.teams.home.logo,
          away: item.teams.away.name,
          awayLogo: item.teams.away.logo,
          league: `${item.country ? item.country.name : ''} - ${item.league.name}`,
          scoreHome: item.scores.home ?? 0,
          scoreAway: item.scores.away ?? 0,
          status: item.status.short,
          elapsed: item.status.timer
        })
      }
    };

    function getFormattedDate(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function switchSport(sport, btn) {
      document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSport = sport;
      fetchMatches();
    }

    function setDateFilter(filter, btn) {
      document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      if (filter === 'yesterday') currentFilter = getFormattedDate(-1);
      else if (filter === 'today') currentFilter = getFormattedDate(0);
      else if (filter === 'tomorrow') currentFilter = getFormattedDate(1);
      else currentFilter = filter;

      fetchMatches();
    }

    function onCustomDateChange(dateValue) {
      if(!dateValue) return;
      document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
      currentFilter = dateValue;
      fetchMatches();
    }

    async function fetchMatches() {
      const container = document.getElementById('matchesContainer');
      const loading = document.getElementById('loading');
      
      container.innerHTML = "";
      loading.style.display = "block";

      const config = SPORT_CONFIGS[currentSport];
      let url = config.baseUrl;

      if (currentFilter === 'live') {
        url += "?live=all";
      } else {
        url += `?date=${currentFilter}`;
      }

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: {
            "x-apisports-key": API_KEY
          }
        });

        const data = await response.json();
        loading.style.display = "none";

        if (!data.response || data.response.length === 0) {
          container.innerHTML = "<div style='text-align:center; color:#888;'>Aucun match disponible.</div>";
          return;
        }

        data.response.slice(0, 40).forEach(rawItem => {
          const match = config.getName(rawItem);
          const isLive = ['1H', '2H', 'HT', 'Q1', 'Q2', 'Q3', 'Q4', 'OT', 'P1', 'P2', 'P3'].includes(match.status);
          
          const card = document.createElement('div');
          card.className = 'match-card';
          card.innerHTML = `
            <div class="league-title">${match.league}</div>
            <div class="match-row">
              <div class="team-info">
                ${match.homeLogo ? `<img src="${match.homeLogo}" class="team-logo">` : ''}
                <span>${match.home}</span>
              </div>
              <span class="score">${match.scoreHome}</span>
            </div>
            <div class="match-row">
              <div class="team-info">
                ${match.awayLogo ? `<img src="${match.awayLogo}" class="team-logo">` : ''}
                <span>${match.away}</span>
              </div>
              <span class="score">${match.scoreAway}</span>
            </div>
            <div style="text-align:right; margin-top: 5px;">
              <span class="status ${isLive ? 'live' : ''}">
                ${isLive ? '🔴 ' + (match.elapsed ? match.elapsed + "'" : match.status) : match.status}
              </span>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        loading.innerText = "Erreur de chargement. Si vous testez en local, enregistrez sur GitHub Pages.";
      }
    }

    fetchMatches();
  </script>
</body>
</html>
