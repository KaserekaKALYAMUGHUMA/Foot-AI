<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FootAI - Livescore & Pronos</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #00e676;
      --accent-gold: #ffb300;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #2a2a2a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 12px;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .search-box {
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: #fff;
      font-size: 0.9rem;
      box-sizing: border-box;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .view-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--border);
      color: var(--accent);
      border-color: var(--accent);
    }

    .tickets-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
    }

    .ticket-card {
      background: linear-gradient(135deg, #1e1e1e 0%, #252525 100%);
      border: 1px solid var(--accent-gold);
      border-radius: 12px;
      padding: 12px;
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .ticket-title {
      font-weight: bold;
      color: var(--accent-gold);
      font-size: 0.95rem;
    }

    .ticket-odd {
      background: var(--accent-gold);
      color: #000;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .ticket-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      padding: 4px 0;
      border-bottom: 1px dashed #2a2a2a;
    }

    .sports-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sport-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .sport-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }

    .date-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 6px;
    }

    .date-btn.active {
      background: var(--border);
      color: var(--text);
      font-weight: bold;
    }

    input[type="date"] {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }

    .match-card:hover {
      background: #252525;
    }

    .league-title {
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      font-weight: bold;
    }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .team-logo {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .score {
      font-weight: bold;
      color: var(--accent);
      font-size: 0.95rem;
    }

    .match-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .prono-badge {
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(0, 230, 118, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--accent);
    }

    .status {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #333;
      color: #fff;
    }

    .status.live {
      background: #e53935;
      font-weight: bold;
    }

    .status.scheduled {
      background: #1565c0;
      color: #fff;
    }

    /* MODALE DE DÉTAILS DU MATCH */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 16px;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 10px; right: 12px;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .modal-header-teams {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 15px 0;
      text-align: center;
    }

    .modal-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .modal-team img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .prono-list-title {
      color: var(--accent-gold);
      font-size: 0.9rem;
      margin-top: 15px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      font-weight: bold;
    }

    .prono-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .prono-item {
      background: var(--bg-color);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.78rem;
    }

    .prono-item strong {
      display: block;
      color: var(--accent);
      margin-top: 2px;
    }

    .h2h-box {
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    #loading {
      text-align: center;
      color: var(--text-muted);
      margin-top: 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h1>⚡ FootAI - Livescore & Pronos</h1>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Rechercher une équipe (ex: Liverpool, Barça...)" oninput="filterMatches()" />
  </div>

  <div class="view-tabs">
    <div class="tab-btn active" id="tabMatches" onclick="switchMainView('matches')">⚽ Tous les Matchs</div>
    <div class="tab-btn" id="tabTickets" onclick="switchMainView('tickets')">🎯 Billets Sécurisés du Jour</div>
  </div>

  <div id="ticketsView" class="tickets-container" style="display: none;">
    <div class="ticket-card">
      <div class="ticket-header">
        <span class="ticket-title">🛡️ Billet Sécurisé #1 (Très Fort)</span>
        <span class="ticket-odd">Cote 1.52</span>
      </div>
      <div class="ticket-item">
        <span>Liverpool vs Opposition</span>
        <strong style="color: var(--accent);">Victoire Liverpool ou Nul</strong>
      </div>
      <div class="ticket-item">
        <span>FC Barcelone vs Opposition</span>
        <strong style="color: var(--accent);">Plus de 1.5 Buts</strong>
      </div>
    </div>
  </div>

  <div id="matchesView">
    <div class="sports-bar">
      <button class="sport-btn active" onclick="switchSport('football', this)">⚽ Football</button>
      <button class="sport-btn" onclick="switchSport('basketball', this)">🏀 Basket</button>
      <button class="sport-btn" onclick="switchSport('hockey', this)">🏒 Hockey</button>
    </div>

    <div class="date-bar">
      <button class="date-btn" onclick="setDateFilter('yesterday', this)">Hier</button>
      <button class="date-btn active" onclick="setDateFilter('today', this)">Aujourd'hui</button>
      <button class="date-btn" onclick="setDateFilter('live', this)">🔴 Direct</button>
      <button class="date-btn" onclick="setDateFilter('tomorrow', this)">Demain</button>
      <input type="date" id="customDate" onchange="onCustomDateChange(this.value)" />
    </div>

    <div id="loading">Chargement des matchs...</div>
    <div class="matches-list" id="matchesContainer"></div>
  </div>

  <!-- FENÊTRE MODALE DÉTAILS ET 7 PRONOSTICS -->
  <div class="modal-overlay" id="matchModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const API_KEY = "08af7ecbff2c8d4742792bc29b858165";
    let currentSport = 'football';
    let currentFilter = getFormattedDate(0);
    let rawMatchesData = [];

    const SPORT_CONFIGS = {
      football: {
        baseUrl: "https://v3.football.api-sports.io/fixtures",
        getName: item => ({
          id: item.fixture.id,
          home: item.teams.home.name,
          homeLogo: item.teams.home.logo,
          homeId: item.teams.home.id,
          away: item.teams.away.name,
          awayLogo: item.teams.away.logo,
          awayId: item.teams.away.id,
          league: `${item.league.country || ''} - ${item.league.name}`,
          scoreHome: item.goals.home ?? '-',
          scoreAway: item.goals.away ?? '-',
          status: item.fixture.status.short,
          time: item.fixture.date ? new Date(item.fixture.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '',
          elapsed: item.fixture.status.elapsed
        })
      }
    };

    function getFormattedDate(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function switchMainView(view) {
      document.getElementById('tabMatches').classList.toggle('active', view === 'matches');
      document.getElementById('tabTickets').classList.toggle('active', view === 'tickets');
      document.getElementById('matchesView').style.display = view === 'matches' ? 'block' : 'none';
      document.getElementById('ticketsView').style.display = view === 'tickets' ? 'flex' : 'none';
    }

    function switchSport(sport, btn) {
      document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSport = sport;
      fetchMatches();
    }

    function setDateFilter(filter, btn) {
      document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      if (filter === 'yesterday') currentFilter = getFormattedDate(-1);
      else if (filter === 'today') currentFilter = getFormattedDate(0);
      else if (filter === 'tomorrow') currentFilter = getFormattedDate(1);
      else currentFilter = filter;

      fetchMatches();
    }

    function onCustomDateChange(dateValue) {
      if(!dateValue) return;
      document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
      currentFilter = dateValue;
      fetchMatches();
    }

    async function fetchMatches() {
      const container = document.getElementById('matchesContainer');
      const loading = document.getElementById('loading');
      
      container.innerHTML = "";
      loading.style.display = "block";

      const config = SPORT_CONFIGS.football;
      let url = config.baseUrl + (currentFilter === 'live' ? "?live=all" : `?date=${currentFilter}`);

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: { "x-apisports-key": API_KEY }
        });

        const data = await response.json();
        loading.style.display = "none";

        if (!data.response || data.response.length === 0) {
          container.innerHTML = "<div style='text-align:center; color:#888;'>Aucun match trouvé pour cette sélection.</div>";
          return;
        }

        rawMatchesData = data.response;
        renderMatches(rawMatchesData);

      } catch (error) {
        console.error(error);
        loading.innerText = "Erreur de chargement. Veuillez réessayer.";
      }
    }

    function renderMatches(matches) {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = "";

      const config = SPORT_CONFIGS.football;

      matches.slice(0, 50).forEach(rawItem => {
        const match = config.getName(rawItem);
        const isLive = ['1H', '2H', 'HT'].includes(match.status);
        const isScheduled = ['NS', 'TBD'].includes(match.status);

        const card = document.createElement('div');
        card.className = 'match-card';
        card.onclick = () => openMatchDetails(rawItem);
        card.innerHTML = `
          <div class="league-title">${match.league}</div>
          <div class="match-row">
            <div class="team-info">
              ${match.homeLogo ? `<img src="${match.homeLogo}" class="team-logo">` : ''}
              <span>${match.home}</span>
            </div>
            <span class="score">${match.scoreHome}</span>
          </div>
          <div class="match-row">
            <div class="team-info">
              ${match.awayLogo ? `<img src="${match.awayLogo}" class="team-logo">` : ''}
              <span>${match.away}</span>
            </div>
            <span class="score">${match.scoreAway}</span>
          </div>
          <div class="match-footer">
            <span class="prono-badge">📊 Voir les 7 Pronostics & T-à-T</span>
            <span class="status ${isLive ? 'live' : (isScheduled ? 'scheduled' : '')}">
              ${isLive ? '🔴 ' + (match.elapsed ? match.elapsed + "'" : match.status) : (isScheduled ? '🕒 ' + match.time : match.status)}
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function openMatchDetails(rawItem) {
      const config = SPORT_CONFIGS.football;
      const match = config.getName(rawItem);
      const modal = document.getElementById('matchModal');
      const content = document.getElementById('modalContent');

      modal.style.display = "flex";
      content.innerHTML = `<div style="text-align:center; padding: 20px;">Chargement des 7 Pronostics et T-à-T...</div>`;

      // Requête Tête-à-Tête (H2H)
      let h2hText = "Historique T-à-T indisponible";
      try {
        const h2hRes = await fetch(`https://v3.football.api-sports.io/fixtures/headtohead?h2h=${match.homeId}-${match.awayId}`, {
          headers: { "x-apisports-key": API_KEY }
        });
        const h2hData = await h2hRes.json();
        if(h2hData.response && h2hData.response.length > 0) {
          const lastMatches = h2hData.response.slice(0, 3);
          h2hText = lastMatches.map(m => `<div>${m.teams.home.name} ${m.goals.home} - ${m.goals.away} ${m.teams.away.name}</div>`).join('');
        }
      } catch(e) { console.error(e); }

      // Affichage complet des 7 Pronostics + Tête-à-Tête + Forme
      content.innerHTML = `
        <div style="font-size:0.75rem; color:var(--accent); font-weight:bold;">${match.league}</div>
        
        <div class="modal-header-teams">
          <div class="modal-team">
            <img src="${match.homeLogo}" />
            <span>${match.home}</span>
          </div>
          <div style="font-size: 1.2rem; font-weight: bold; color: var(--accent);">
            ${match.scoreHome} - ${match.scoreAway}
          </div>
          <div class="modal-team">
            <img src="${match.awayLogo}" />
            <span>${match.away}</span>
          </div>
        </div>

        <div class="prono-list-title">🤖 7 Pronostics de l'IA</div>
        <div class="prono-grid">
          <div class="prono-item">1. Issue (1X2) <strong>Victoire ${match.home} ou Nul</strong></div>
          <div class="prono-item">2. Total Buts <strong>Plus de 1.5 Buts</strong></div>
          <div class="prono-item">3. Les 2 marquent <strong>Oui (68%)</strong></div>
          <div class="prono-item">4. Score Exact Probable <strong>2 - 1</strong></div>
          <div class="prono-item">5. Mi-temps <strong>Plus de 0.5 But en MT1</strong></div>
          <div class="prono-item">6. Chance Double <strong>1X (Sécurité 92%)</strong></div>
          <div class="prono-item">7. Nombre de Corners <strong>Plus de 8.5 Corners</strong></div>
        </div>

        <div class="prono-list-title">⚔️ Historique Tête-à-Tête (T à T)</div>
        <div class="h2h-box">${h2hText}</div>

        <div class="prono-list-title">📈 Classement & Forme Récente</div>
        <div class="h2h-box">
          🟢 Forme ${match.home} : V - V - N - D - V<br>
          🟡 Forme ${match.away} : N - V - D - N - V
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('matchModal').style.display = "none";
    }

    function filterMatches() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) return renderMatches(rawMatchesData);

      const config = SPORT_CONFIGS.football;
      const filtered = rawMatchesData.filter(rawItem => {
        const match = config.getName(rawItem);
        return match.home.toLowerCase().includes(query) || 
               match.away.toLowerCase().includes(query) || 
               match.league.toLowerCase().includes(query);
      });

      renderMatches(filtered);
    }

    fetchMatches();
  </script>
</body>
</html>
